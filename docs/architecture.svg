<rect x="0" y="0" width="1680" height="1180" fill="#FFFFFF"/>
<text x="70" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#14375E" style="paint-order:stroke;stroke:#ffffff;stroke-width:4.5px;stroke-linejoin:round">ChatDemo · 仿微信实时聊天系统 总体架构</text>
<text x="1610" y="46" text-anchor="end" font-size="14" font-weight="400" fill="#5A6B84" style="paint-order:stroke;stroke:#ffffff;stroke-width:4.5px;stroke-linejoin:round">客户端 Qt 6 · 服务端 C++20 / Boost.Asio + gRPC · MySQL / Redis</text>
