  <text x="1345" y="194" text-anchor="middle" font-size="12.5" fill="#4A5568">TCPMgr（聊天长连接 · 心跳 · 粘包分包）</text>
  <text x="1345" y="214" text-anchor="middle" font-size="12.5" fill="#4A5568">TCPFileMgr（文件通道 · 进度 · 断点续传）</text>
