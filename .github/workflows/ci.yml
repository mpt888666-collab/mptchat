name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 钉死 vcpkg 版本：以前每次跑都 clone 最新 master，master 一漂移、port 一变，
  # 所有依赖的 ABI 就跟着变，缓存虽然恢复成功也判定过期 → 整棵树重编。
  VCPKG_REF: "0699a19d0c6386247ce50d4dedbb8217d484d536"
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  # ---------------------------------------------------------------------------
  # 1) 建表脚本可在 MySQL 8 上干净执行（8 张表）
  # ---------------------------------------------------------------------------
  schema:
    name: MySQL schema check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - name: Create database and apply schema
        run: |
          set -e
          mysql -h127.0.0.1 -uroot -proot \
            -e "CREATE DATABASE IF NOT EXISTS chatdb DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 chatdb < db/schema.sql

      - name: Verify table count
        run: |
          set -e
          n=$(mysql -h127.0.0.1 -uroot -proot -N \
              -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='chatdb';")
          echo "chatdb tables = $n"
          test "$n" -eq 8

  # ---------------------------------------------------------------------------
  # 2) Windows / Linux 双平台 Release 构建（统一用 Ninja）
  #    Windows 钉在 windows-2022：windows-latest 现在换成 VS 18(MSVC 14.51)，
  #    跟本机 VS 2022 差太多，会编挂 gRPC 的头文件
  #    vcpkg 首次要从源码编 gRPC / Boost，约 1-2 小时；命中二进制缓存后 1-3 分钟
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-2022
            triplet: x64-windows-release
          - name: linux-gcc
            os: ubuntu-latest
            triplet: x64-linux
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      # 先把环境打出来：以后失败一眼就能看出是哪台机器、哪个 triplet、工具在哪
      - name: Environment info
        shell: bash
        run: |
          set -e
          echo "runner.os = $RUNNER_OS"
          echo "triplet   = $VCPKG_DEFAULT_TRIPLET"
          echo "VCPKG_ROOT = $VCPKG_ROOT"
          echo "VCPKG_REF  = $VCPKG_REF"
          echo "PATH      = $PATH"
          cmake --version | head -n 1
          if [ "$RUNNER_OS" = "Linux" ]; then
            [ "$VCPKG_DEFAULT_TRIPLET" = "x64-linux" ] || { echo "::error::Linux job 的 triplet 必须是 x64-linux"; exit 1; }
          else
            [ "$VCPKG_DEFAULT_TRIPLET" = "x64-windows-release" ] || { echo "::error::Windows job 的 triplet 必须是 x64-windows-release"; exit 1; }
          fi

      # Linux：vcpkg 不会自己下载 ninja，必须系统里有；顺便把 ninja 路径显式导出，
      # 免得 vcpkg 端口构建里的 CMake 在 PATH 里找不到它（就是上次那个报错）
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential
          NINJA_BIN="$(command -v ninja)"
          test -x "$NINJA_BIN"
          "$NINJA_BIN" --version
          echo "NINJA=$NINJA_BIN" >> "$GITHUB_ENV"
          echo "CMAKE_MAKE_PROGRAM=$NINJA_BIN" >> "$GITHUB_ENV"
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      # Windows：不再让 CMake 自己去找 Visual Studio（上次就是它找不到），
      # 改成先用 vcvars 把 MSVC 环境准备好，再用 Ninja 构建
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # VS 自带的 vcpkg 会在 vcvars 里塞进 PATH/VCPKG_ROOT，把我们的路径盖掉，
      # 这里显式打回来，保证后面用的还是 workspace 里那份
      - name: Pin VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      # restore / save 分开写：job 失败也把 vcpkg 二进制缓存留下来，
      # 这样不用每次提交都从头编 1-2 小时
      # 缓存 key 里带上 runner 镜像版本：镜像一更新（MSVC 版本变了）ABI 就变，
      # 那时要换新 key，而不是一直"命中旧缓存但重建"
      - name: Runner image version
        id: image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ env.VCPKG_REF }}-${{ steps.image.outputs.version }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-${{ env.VCPKG_REF }}-
            vcpkg-${{ matrix.name }}-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -e
          mkdir -p "${{ github.workspace }}/vcpkg-cache"
          # 注意：缓存可能先恢复了 installed/，所以不能只判断目录是否存在，
          # 要判断 bootstrap 脚本在不在，否则会把 clone 跳过
          # 只有脚本不在、或者当前 checkout 不是钉住的那个 commit 时才重新拉；
          # 指定 commit 拉比 clone 整个 master 更小更快，版本也稳定
          if [ ! -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ] || [ "$(git -C "$VCPKG_ROOT" rev-parse HEAD 2>/dev/null)" != "$VCPKG_REF" ]; then
            rm -rf "$VCPKG_ROOT"
            git init -q "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
            git -C "$VCPKG_ROOT" fetch --depth 1 -q origin "$VCPKG_REF"
            git -C "$VCPKG_ROOT" checkout -q --detach FETCH_HEAD
          fi
          echo "vcpkg commit = $(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      # 依赖单独一步装：装坏了就是这一步红，不会跟后面的配置混在一起
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          set -e
          echo "ninja -> $(command -v ninja || echo MISSING)"
          cd "$GITHUB_WORKSPACE"
          "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.triplet }} --overlay-triplets="$GITHUB_WORKSPACE/ci/triplets" --clean-after-build

      - name: Configure and build services
        shell: bash
        run: |
          set -e
          for svc in StatusServer GetServer ChatServer ChatServer2 ResourceServer; do
            echo "::group::build $svc"
            cmake -S "$svc" -B "build/$svc" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_MAKE_PROGRAM="${CMAKE_MAKE_PROGRAM:-ninja}" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
              -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/ci/triplets" \
              -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE" \
              -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed"
            cmake --build "build/$svc" --config Release --parallel
            echo "::endgroup::"
          done

      - name: Show artifacts
        if: always()
        shell: bash
        run: |
          find build -maxdepth 4 -type f \( -name '*.exe' -o -name 'StatusServer' -o -name 'GetServer' -o -name 'ChatServer' -o -name 'ChatServer2' -o -name 'ResourceServer' \) -printf '%p  %s bytes\n' 2>/dev/null || true

      # 每次都存，key 带 run_id 不会撞车：万一恢复到的缓存是旧的、或者不完整，
      # 这一轮重建出来的结果会覆盖进来，下一轮才是热的；不存的话可能永远卡在
      # "命中旧缓存但缺包"上。仓库缓存总上限 10GB，超了 GitHub 按最久未使用淘汰，
      # 正好淘汰掉旧的那份。
      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ env.VCPKG_REF }}-${{ steps.image.outputs.version }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Upload server binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatdemo-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            build/StatusServer/StatusServer.exe
            build/GetServer/GetServer.exe
            build/ChatServer/ChatServer.exe
            build/ChatServer2/ChatServer2.exe
            build/ResourceServer/ResourceServer.exe
            build/StatusServer/StatusServer
            build/GetServer/GetServer
            build/ChatServer/ChatServer
            build/ChatServer2/ChatServer2
            build/ResourceServer/ResourceServer